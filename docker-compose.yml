services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belgisiz
      POSTGRES_PASSWORD: belgisiz
      POSTGRES_DB: belgisiz_nomur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belgisiz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://belgisiz:belgisiz@postgres:5432/belgisiz_nomur
      REDIS_URL: redis://redis:6379
      CONFIG_PATH: /app/config/kg.yaml
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
